name: paperintel

services:
  db:
    build:
      context: ./docker/db
    image: paperintel-db:pg16-pgvector
    container_name: paperintel-db
    environment:
      POSTGRES_USER: paperintel
      POSTGRES_PASSWORD: paperintel
      POSTGRES_DB: paperintel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperintel -d paperintel"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: paperintel-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
